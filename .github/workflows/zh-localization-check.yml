name: 中文化校验

on:
  push:
    branches: [cn/main]
    paths:
      - "app/**/*.rs"
      - "README.md"
      - ".github/workflows/zh-localization-check.yml"
  pull_request:
    branches: [cn/main]
    paths:
      - "app/**/*.rs"
      - "README.md"
      - ".github/workflows/zh-localization-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zh-localization-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows 格式与编译检查
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: 检出源码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: 准备官方 Windows 构建环境
        uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: false
          install_test_deps: false

      - name: 检查 Rust 格式
        shell: bash
        run: cargo fmt --check

      - name: 检查 Warp 客户端库
        shell: bash
        run: cargo check --locked -p warp --lib
